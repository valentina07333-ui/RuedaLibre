      <line x1="52" y1="76" x2="57" y2="83" stroke="#5B8FC9" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="54.5" y1="83.5" x2="60" y2="83.5" stroke="#5B8FC9" stroke-width="2.6" stroke-linecap="round"/>
