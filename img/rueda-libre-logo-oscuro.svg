<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Rueda Libre" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Rueda Libre</title>
  <defs>
    <clipPath id="badgeClip">
      <circle cx="60" cy="60" r="54"/>
